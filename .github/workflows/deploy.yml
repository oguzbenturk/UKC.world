name: CI

# Deployment is done from the developer machine with `npm run push-all` (SSH to the
# production server, see docs/wiki/Deployment_Infrastructure.md). This workflow only
# checks every push. The old "deploy" job pointed at a wrong server path
# (/opt/plannivo) and must never run, so it was removed (2026-10-07).
#
# Backend Jest suites need a database with production-like data and run locally:
#   npm run test:ci   (before every push-all)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Frontend unit tests (Vitest)
        run: npx vitest run

      - name: Translation keys present in all languages
        run: node scripts/check-i18n-keys.mjs
